name: CI and scheduled model refresh

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q

  refresh-model:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m app.data.generate_data
      - run: python -m app.models.pipeline
      - uses: actions/upload-artifact@v4
        with:
          name: real-estate-model-${{ github.run_number }}
          path: |
            artifacts/production_model.pkl
            artifacts/model_registry.json
          retention-days: 30
