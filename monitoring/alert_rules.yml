groups:
  - name: real-estate-api
    rules:
      - alert: RealEstateApiDown
        expr: up{job="real-estate-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Real estate prediction API is unreachable
      - alert: RealEstateApiHighErrorRate
        expr: rate(prediction_errors_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Prediction failures are elevated
      - alert: RealEstateApiHighLatency
        expr: histogram_quantile(0.95, sum by (le) (rate(prediction_latency_seconds_bucket[5m]))) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Prediction API p95 latency exceeds one second
